<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><title>Jam Room – Collaborative DAW</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f4f7;--pn:#fff;--tx:#1b1b22;--mu:#6b6b78;--ac:#7c3aed;--bd:#d8d8e2;--gr:#ececf2;--gr2:#dcdce6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121218;--pn:#1c1c26;--tx:#ececf4;--mu:#9a9aae;--bd:#2e2e3c;--gr:#20202c;--gr2:#2a2a38}}
:root[data-theme="dark"]{--bg:#121218;--pn:#1c1c26;--tx:#ececf4;--mu:#9a9aae;--bd:#2e2e3c;--gr:#20202c;--gr2:#2a2a38}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;background:var(--pn);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
h1{font-size:15px;margin:0 6px 0 0}
button,select,input{font:inherit;color:var(--tx);background:var(--gr);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;min-height:36px}
button{cursor:pointer}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input[type=number]{width:64px}input[type=range]{padding:0;width:100%;min-height:24px}
.sp{flex:1}.pill{color:var(--mu);font-size:12px}
main{display:grid;grid-template-columns:230px 1fr;gap:10px;padding:10px}
@media(max-width:760px){main{grid-template-columns:1fr}}
.tk{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:8px;margin-bottom:8px;border-left:5px solid var(--c)}
.tk.sel{outline:2px solid var(--ac)}
.tk .r{display:flex;gap:6px;align-items:center;margin-top:6px}
.tk b{cursor:pointer;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk select{flex:1;min-width:0}
#gw{background:var(--pn);border:1px solid var(--bd);border-radius:10px;overflow:auto;max-height:68vh}
canvas{display:block}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
</style></head><body>
<header>
<h1>🎛 Jam Room</h1>
<button id="play">▶ Play</button><button id="stop">■</button>
<label class="pill">BPM <input id="bpm" type="number" min="60" max="200" value="110"></label>
<button id="rec2" title="Record keyboard/MIDI notes while playing (1 bar count-in)">⏺ Rec</button><button id="met">Click</button><button id="ud" title="Undo">↶</button><button id="rd" title="Redo">↷</button>
<label class="pill">Bars <select id="bars"><option>1</option><option selected>2</option><option>4</option><option>8</option></select></label>
<label class="pill">Delay <input id="fxd" type="range" min="0" max="1" step=".05" value="0" style="width:70px"></label>
<label class="pill">Reverb <input id="fxr" type="range" min="0" max="1" step=".05" value="0" style="width:70px"></label>
<label class="pill">Swing <input id="sw" type="range" min="0" max="1" step=".05" value="0" style="width:60px"></label><label class="pill">Vol <input id="mv" type="range" min="0" max="1" step=".01" value=".8" style="width:60px"></label><i id="mt" style="display:inline-block;height:8px;width:0;background:var(--ac);border-radius:4px"></i><button id="exp">Export WAV</button><button id="sj">Save</button><button id="lj">Load</button><input id="lf" type="file" accept=".json" hidden>
<button id="inv">🔗 Invite</button><span class="sp"></span><span class="pill" id="who">Solo</span><span class="pill" id="sync">local</span>
</header>
<main>
<section><div class="bar"><select id="add"></select><button id="addb">+ Track</button></div><div id="tl"></div></section>
<section><div class="bar"><span class="pill" id="tn"></span><label class="pill">Note length
<select id="len"><option value="1">1/16</option><option value="2">1/8</option><option value="4">1/4</option><option value="8">1/2</option></select></label>
<button id="clr">Clear track</button><button id="dup">Duplicate</button><button id="ren">Rename</button><button id="tu">♯</button><button id="td">♭</button><button id="ou">+8ve</button><button id="od">−8ve</button><button id="dbl">Double bars</button><button id="selb" title="Drag to select/move notes. Del removes, [ ] resize, Ctrl+C/V copy/paste">Select</button><button id="mid">Export MIDI</button><button id="wt">WAV (track)</button><span class="pill">Key <select id="key"></select> <select id="scl"><option value="chrom">Chromatic</option><option value="major">Major</option><option value="minor">Minor</option><option value="pent">Pentatonic</option><option value="blues">Blues</option></select> <label><input type="checkbox" id="lock"> lock</label></span></div>
<div class="bar" id="smpbar" style="display:none"><label class="pill">Sample <input type="file" id="sf" accept="audio/*"></label><select id="lib"><option value="">Library…</option><option>kick.wav</option><option>snare.wav</option><option>hat.wav</option><option>clap.wav</option><option>tom.wav</option><option>rim.wav</option><option>bass808.wav</option><option>stab.wav</option></select><button id="rec">● Record</button><span class="pill">Samples are saved in the project</span></div><div id="gw"><canvas id="cv"></canvas></div>
<p class="pill">Tap the grid to place/remove notes. Keys A–; play notes (Z/X = octave, drums: A–H). Hit Rec, then Play, to record live.</p><div class="bar" style="flex-direction:column;align-items:stretch"><div id="cl" class="pill" style="height:84px;overflow:auto;background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:6px"></div><input id="ci" placeholder="Chat with the room…"></div></section>
</main>
<script>
let STEPS=32;const CW=30,CH=22,LW=46;
const INST={drums:{n:'Drum kit',drum:1,c:'#ef4444'},synth:{n:'Lead synth',b:60,c:'#8b5cf6'},bass:{n:'Bass',b:36,c:'#0ea5e9'},keys:{n:'Electric keys',b:48,c:'#f59e0b'},pluck:{n:'Pluck',b:60,c:'#10b981'},pad:{n:'Warm pad',b:48,c:'#ec4899'},sampler:{n:'Sampler',b:60,c:'#14b8a6'}};
const DR=['Kick','Snare','Hat','Clap','Tom','Perc'],NN=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const S={swing:0,bpm:110,bars:2,fx:{delay:0,reverb:0},tracks:{},sel:null};let peers=0;const dirty={};
const $=i=>document.getElementById(i);
function seed(){const d=(a)=>a.map(([s,p,l])=>s+':'+p+':'+(l||1));
const k=[],h=[],sn=[];for(let i=0;i<32;i+=8){k.push([i,0],[i+6,0]);sn.push([i+4,1])}for(let i=0;i<32;i+=2)h.push([i,2]);
return{t_drums:{name:'Drums',inst:'drums',vol:.9,mute:false,order:0,notes:d([...k,...sn,...h])},
t_bass:{name:'Bass',inst:'bass',vol:.8,mute:false,order:1,notes:d([[0,41,3],[8,41,3],[16,44,3],[24,46,3]])},
t_keys:{name:'Keys',inst:'keys',vol:.6,mute:false,order:2,notes:d([[0,60,4],[0,64,4],[0,67,4],[16,62,4],[16,65,4],[16,69,4]])}}}
const parse=t=>(t.notes||[]).map(s=>s.split(':').map(Number));
// ---------- audio ----------
let AC,master,nb;
function ctxInit(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();master=mk(AC,AC.destination);master.gain.value=+$('mv').value;const an=AC.createAnalyser();an.fftSize=256;master.connect(an);const bf=new Uint8Array(256);(function m(){an.getByteTimeDomainData(bf);let p=0;for(const v of bf)p=Math.max(p,Math.abs(v-128));$('mt').style.width=Math.min(60,p/128*90)+'px';requestAnimationFrame(m)})()}
function mk(c,dest){const g=c.createGain();g.gain.value=.8;const cp=c.createDynamicsCompressor();g.connect(cp);cp.connect(dest);
const dl=c.createDelay(1);dl.delayTime.value=60/S.bpm*.75;const fb=c.createGain();fb.gain.value=.4;dl.connect(fb);fb.connect(dl);const dg=c.createGain();dg.gain.value=S.fx.delay;g.connect(dg);dg.connect(dl);dl.connect(cp);
const len=c.sampleRate*1.8,ir=c.createBuffer(2,len,c.sampleRate);for(let h=0;h<2;h++){const d=ir.getChannelData(h);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
const cv=c.createConvolver();cv.buffer=ir;const rg=c.createGain();rg.gain.value=S.fx.reverb;g.connect(rg);rg.connect(cv);cv.connect(cp);c._fx={dg,rg,dl,cv};return g}
function noise(c){const b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
const f=m=>440*Math.pow(2,(m-69)/12);
function voice(c,out,inst,p,t,dur,v){const G=(a,b)=>{const g=c.createGain();g.gain.setValueAtTime(a,t);g.connect(out);return g};
const O=(ty,fr,to)=>{const o=c.createOscillator();o.type=ty;o.frequency.setValueAtTime(fr,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+.15);return o};
const N=(ty,fq,len,vol)=>{const s=c.createBufferSource();s.buffer=c._nb||(c._nb=noise(c));const fl=c.createBiquadFilter();fl.type=ty;fl.frequency.value=fq;const g=G(vol*v);g.gain.exponentialRampToValueAtTime(.001,t+len);s.connect(fl);fl.connect(g);s.start(t);s.stop(t+len+.05)};
if(inst==='drums'){
if(p===0){const o=O('sine',150,40),g=G(1.1*v);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.connect(g);o.start(t);o.stop(t+.45)}
else if(p===1){N('highpass',1500,.2,.7);const o=O('triangle',190),g=G(.5*v);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.connect(g);o.start(t);o.stop(t+.15)}
else if(p===2)N('highpass',7500,.06,.45);
else if(p===3){N('bandpass',1600,.18,.9)}
else if(p===4){const o=O('sine',220,90),g=G(.9*v);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);o.start(t);o.stop(t+.35)}
else{const o=O('square',880),g=G(.25*v);g.gain.exponentialRampToValueAtTime(.001,t+.08);o.connect(g);o.start(t);o.stop(t+.1)}return}
const fq=f(p),fl=c.createBiquadFilter(),g=c.createGain();fl.type='lowpass';fl.connect(g);g.connect(out);
const end=t+dur;let a=.005,pk=.35*v,cut=3000,ty=['sawtooth'],dt=[0],r=.15;
if(inst==='bass'){cut=600;ty=['sawtooth','sine'];dt=[0,-12]}
if(inst==='keys'){cut=5000;ty=['triangle','sine'];dt=[0,12];r=.4}
if(inst==='pluck'){cut=4500;ty=['sawtooth'];r=.1;fl.frequency.setValueAtTime(5000,t);fl.frequency.exponentialRampToValueAtTime(400,t+.35)}
if(inst==='pad'){cut=1400;ty=['sawtooth','sawtooth'];dt=[-7,7];a=.25;r=.6}
if(inst!=='pluck')fl.frequency.setValueAtTime(cut,t);
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(pk,t+a);
if(inst==='keys'||inst==='pluck')g.gain.exponentialRampToValueAtTime(pk*.3,t+Math.min(dur,.6));
g.gain.setValueAtTime(g.gain.value||pk,end);g.gain.linearRampToValueAtTime(0,end+r);
ty.forEach((y,i)=>{const o=c.createOscillator();o.type=y;o.frequency.value=inst==='bass'&&i===1?fq/2:fq;o.detune.value=inst==='keys'&&i===1?0:(dt[i]||0)*(inst==='bass'?0:1);const og=c.createGain();og.gain.value=.6;o.connect(og);og.connect(fl);o.start(t);o.stop(end+r+.05)})}
const smp={};let only=null;
function sched(c,out,step,t,sd){const so=Object.values(S.tracks).some(x=>x.solo);for(const id in S.tracks){const k=S.tracks[id];if(only&&id!==only)continue;if(k.mute||(so&&!k.solo&&!only))continue;let o=null;const av=k.auto&&k.auto[step]!=null?k.auto[step]:1;for(const[s,p,l]of parse(k))if(s===step){if(!o){const fl=c.createBiquadFilter();fl.frequency.value=200*Math.pow(100,k.lp==null?1:k.lp);fl.connect(out);o=c.createStereoPanner();o.pan.value=k.pan||0;o.connect(fl);if(c._fx){const a=c.createGain();a.gain.value=k.sd||0;o.connect(a);a.connect(c._fx.dl);const b2=c.createGain();b2.gain.value=k.sr||0;o.connect(b2);b2.connect(c._fx.cv)}}
if(k.inst==='sampler'){const b=smp[id];if(b){const x=c.createBufferSource(),g=c.createGain();x.buffer=b;x.playbackRate.value=Math.pow(2,(p-60)/12);g.gain.value=k.vol*av;x.connect(g);g.connect(o);x.start(t);x.stop(t+(l>1?l*sd:b.duration))}}else voice(c,o,k.inst,p,t,l*sd,k.vol*av)}}}
// ---------- transport ----------
let playing=false,step=0,nextT=0,timer,startT=0;
function start(){ctxInit();AC.resume();if(playing)return;playing=true;step=0;cin=recOn?16:0;nextT=AC.currentTime+.08;startT=nextT+cin*60/S.bpm/4;$('play').classList.add('on');timer=setInterval(tick,25);requestAnimationFrame(draw)}
function stop(){playing=false;clearInterval(timer);$('play').classList.remove('on');draw()}
let cin=0,metOn=false,recOn=false;
function click(t,acc){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=acc?1500:1000;g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.04);o.connect(g);g.connect(master);o.start(t);o.stop(t+.05)}
function tick(){const sd=60/S.bpm/4;while(nextT<AC.currentTime+.12){if(cin>0){if(cin%4===0)click(nextT,cin===16);cin--;nextT+=sd;continue}
sched(AC,master,step,nextT+(step%2?(S.swing||0)*sd*.5:0),sd);if(metOn&&step%4===0)click(nextT,step%16===0);nextT+=sd;step=(step+1)%STEPS}}
const curStep=()=>playing?Math.floor(((AC.currentTime-startT)/(60/S.bpm/4))%STEPS):-1;
// ---------- grid ----------
const cv=$('cv'),cx=cv.getContext('2d');
const T=()=>S.tracks[S.sel];
function rows(k){return INST[k.inst].drum?6:24}
function pitchOf(k,r){return INST[k.inst].drum?r:INST[k.inst].b+23-r}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v)}
function draw(){const k=T();if(!k){return}const R=rows(k),dpr=devicePixelRatio||1,W=LW+STEPS*CW,H=R*CH+44;
if(cv.width!==W*dpr||cv.height!==H*dpr){cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px'}
cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,W,H);
const gr=css('--gr'),gr2=css('--gr2'),mu=css('--mu'),c=INST[k.inst].c;
for(let r=0;r<R;r++){const p=pitchOf(k,r),blk=!INST[k.inst].drum&&[1,3,6,8,10].includes(p%12);cx.fillStyle=blk?gr2:gr;cx.fillRect(LW,r*CH,W-LW,CH-1);if(!INST[k.inst].drum&&scaleName!=='chrom'&&inScale(p)){cx.fillStyle='rgba(124,58,237,.14)';cx.fillRect(LW,r*CH,W-LW,CH-1)}
cx.fillStyle=mu;cx.font='11px system-ui';cx.fillText(INST[k.inst].drum?DR[r]:NN[p%12]+(Math.floor(p/12)-1),4,r*CH+15)}
for(let s=0;s<=STEPS;s++){cx.fillStyle=s%16===0?mu:s%4===0?gr2:'transparent';cx.fillRect(LW+s*CW,0,1,H)}
cx.fillStyle=c;for(const[s,p,l]of parse(k)){const r=INST[k.inst].drum?p:INST[k.inst].b+23-p;if(r<0||r>=R)continue;cx.fillRect(LW+s*CW+1,r*CH+1,l*CW-2,CH-3);if(picked.has(s+':'+p)){cx.strokeStyle='#fff';cx.lineWidth=2;cx.strokeRect(LW+s*CW+1,r*CH+1,l*CW-2,CH-3)}}
const y0=R*CH;cx.fillStyle=mu;cx.font='10px system-ui';cx.fillText('Vol',4,y0+26);cx.globalAlpha=.7;for(let s=0;s<STEPS;s++){const v=k.auto&&k.auto[s]!=null?k.auto[s]:1;cx.fillStyle=c;cx.fillRect(LW+s*CW+2,y0+4+(1-v)*36,CW-4,v*36+1)}cx.globalAlpha=1;
if(drag&&drag.band){const a=Math.min(drag.s0,drag.s1),z=Math.max(drag.s0,drag.s1),r1=Math.min(drag.r0,drag.r1),r2=Math.max(drag.r0,drag.r1);cx.strokeStyle=mu;cx.strokeRect(LW+a*CW,r1*CH,(z-a+1)*CW,(r2-r1+1)*CH)}
const cs=curStep();if(cs>=0){cx.fillStyle='rgba(124,58,237,.25)';cx.fillRect(LW+cs*CW,0,CW,H)}
if(playing)requestAnimationFrame(draw)}
let selMode=false,picked=new Set(),drag=null,clip=[],lastS=0;
function laneSet(k,x,y,R){const s=Math.floor(x/CW);if(s<0||s>=STEPS)return;k.auto=k.auto||[];for(let i=0;i<STEPS;i++)if(k.auto[i]==null)k.auto[i]=1;k.auto[s]=Math.max(0,Math.min(1,1-(y-R*CH-4)/36));save(S.sel);draw()}
cv.addEventListener('pointerdown',e=>{const k=T();if(!k)return;const b=cv.getBoundingClientRect(),x=e.clientX-b.left-LW,y=e.clientY-b.top,R=rows(k);ctxInit();AC.resume();
if(y>=R*CH){if(x>=0){drag={lane:1};laneSet(k,x,y,R)}return}
if(x<0)return;
const s=Math.floor(x/CW),r=Math.floor(y/CH),p=pitchOf(k,r),L=INST[k.inst].drum?1:+$('len').value,ns=parse(k),i=ns.findIndex(([a,q,l])=>q===p&&s>=a&&s<a+l);lastS=s;
if(selMode){if(i>=0){const n=ns[i],kk=n[0]+':'+n[1];if(!picked.has(kk)){if(!e.shiftKey)picked.clear();picked.add(kk)}drag={mv:1,s0:s,p0:p,base:ns.map(a=>a.slice()),sel:new Set(picked),ds:0,dp:0}}else{if(!e.shiftKey)picked.clear();drag={band:1,s0:s,r0:r,s1:s,r1:r}}draw();return}
if(i<0&&lockOn&&!INST[k.inst].drum&&!inScale(p))return;
if(i>=0)ns.splice(i,1);else{ns.push([s,p,Math.min(L,STEPS-s)]);if(k.inst!=='sampler')voice(AC,master,k.inst,p,AC.currentTime+.01,.3,k.vol)}
k.notes=ns.map(a=>a.join(':'));save(S.sel);draw()});
addEventListener('pointermove',e=>{if(!drag)return;const k=T();if(!k)return;const b=cv.getBoundingClientRect(),x=e.clientX-b.left-LW,y=e.clientY-b.top,R=rows(k),s=Math.floor(x/CW),r=Math.floor(y/CH);
if(drag.lane)laneSet(k,x,y,R);else if(drag.band){drag.s1=s;drag.r1=r;draw()}
else if(drag.mv){drag.ds=s-drag.s0;drag.dp=pitchOf(k,Math.max(0,Math.min(R-1,r)))-drag.p0;k.notes=drag.base.map(n=>(drag.sel.has(n[0]+':'+n[1])?[Math.max(0,Math.min(STEPS-n[2],n[0]+drag.ds)),n[1]+drag.dp,n[2]]:n).join(':'));draw()}});
addEventListener('pointerup',()=>{if(!drag)return;const k=T(),d=drag;drag=null;if(!k)return;
if(d.band){const a=Math.min(d.s0,d.s1),z=Math.max(d.s0,d.s1),r1=Math.min(d.r0,d.r1),r2=Math.max(d.r0,d.r1);parse(k).forEach(([s,p,l])=>{const r=INST[k.inst].drum?p:INST[k.inst].b+23-p;if(s+l>a&&s<=z&&r>=r1&&r<=r2)picked.add(s+':'+p)})}
else if(d.mv&&(d.ds||d.dp)){picked=new Set(d.base.filter(n=>d.sel.has(n[0]+':'+n[1])).map(n=>Math.max(0,Math.min(STEPS-n[2],n[0]+d.ds))+':'+(n[1]+d.dp)));save(S.sel)}
draw()});
// ---------- tracks UI ----------
function list(){return Object.entries(S.tracks).sort((a,b)=>(a[1].order||0)-(b[1].order||0))}
function render(){const tl=$('tl');tl.innerHTML='';if(!S.tracks[S.sel])S.sel=(list()[0]||[])[0];
for(const[id,k]of list()){const d=document.createElement('div');d.className='tk'+(id===S.sel?' sel':'');d.style.setProperty('--c',INST[k.inst].c);
const nm=document.createElement('b');nm.textContent=k.name;nm.onclick=()=>{S.sel=id;picked.clear();render();draw()};
const mu=document.createElement('button');mu.textContent=k.mute?'Muted':'M';mu.className=k.mute?'on':'';mu.onclick=()=>{k.mute=!k.mute;save(id);render()};
const so=document.createElement('button');so.textContent='S';so.className=k.solo?'on':'';so.onclick=()=>{k.solo=!k.solo;save(id);render()};const dl=document.createElement('button');dl.textContent='✕';dl.onclick=()=>{delete S.tracks[id];send('del',{id});persist();commit();render();draw()};
const r1=document.createElement('div');r1.className='r';r1.append(nm,so,mu,dl);
const sel=document.createElement('select');for(const i in INST){const o=new Option(INST[i].n,i);if(i===k.inst)o.selected=true;sel.add(o)}
sel.onchange=()=>{k.inst=sel.value;k.notes=[];save(id);render();draw()};
const vl=document.createElement('input');vl.type='range';vl.min=0;vl.max=1;vl.step=.01;vl.value=k.vol;vl.oninput=()=>{k.vol=+vl.value;save(id)};

async function exportWav(id){only=typeof id==='string'?id:null;const sd=60/S.bpm/4,len=STEPS*sd+1.5,sr=44100,oc=new OfflineAudioContext(2,Math.ceil(len*sr),sr),out=mk(oc,oc.destination);

addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;const k=T();if(!k)return;const kk=e.key.toLowerCase();

const vlq=n=>{const b=[n&127];while(n>>=7)b.unshift((n&127)|128);return b};

function midiFile(){const U=120,GM=[36,38,42,39,45,56],trk=ev=>{ev.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);let t=0,o=[];for(const[at,,...by]of ev){o.push(...vlq(at-t),...by);t=at}o.push(0,255,47,0);return[77,84,114,107,...be(o.length,4),...o]};
